name: Paper engine checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Offline unit and integration checks
        run: python run_tests.py
      - name: Synthetic end-to-end acceptance scenario
        run: python run.py demo
      - name: Verify paper configuration
        run: python run.py --config config/paper.toml doctor

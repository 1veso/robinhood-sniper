[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robinhood-sniper"
version = "0.1.4"
description = "Auditable on-chain research and deterministic paper trading"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
sniper = "sniper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
